<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards: Segurados do INSS (Foco TDAH)</title>
<style>
  /* Temas Neutros para Conforto Visual e Foco (TDAH) */
  :root, [data-theme="petroleo"] {
    --bg-main: #0f171a;
    --bg-card: #182529;
    --bg-card-back: #203136;
    --text-main: #eef2f3;
    --text-muted: #9eb0b5;
    --accent: #74c0fc;
    --alert: #ffd43b;
    --border: #2c4047;
  }

  [data-theme="ardosia"] {
    --bg-main: #18191c;
    --bg-card: #24262b;
    --bg-card-back: #2e3138;
    --text-main: #f1f3f5;
    --text-muted: #adb5bd;
    --accent: #a5d8ff;
    --alert: #ffe066;
    --border: #3b3f47;
  }

  [data-theme="areia"] {
    --bg-main: #23201d;
    --bg-card: #302c28;
    --bg-card-back: #3d3833;
    --text-main: #f5f0eb;
    --text-muted: #c2b8ae;
    --accent: #8ce99a;
    --alert: #ffc078;
    --border: #4f4841;
  }

  * {
    box-sizing: border-box;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 24px 16px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.55;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  .container {
    width: 100%;
    max-width: 650px;
  }

  /* Barra Superior de Alternância de Cores Neutras */
  .theme-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .theme-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-right: 4px;
  }

  .theme-btn {
    background-color: var(--bg-card);
    color: var(--text-main);
    border: 1.5px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }

  .theme-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background-color: var(--bg-card-back);
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  h1 {
    color: var(--accent);
    font-size: 24px;
    margin: 0 0 6px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 15px;
    margin: 0;
  }

  /* Barra de Filtros por Categoria */
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 26px;
  }

  .filter-btn {
    background-color: var(--bg-card);
    color: var(--text-main);
    border: 1.5px solid var(--border);
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-btn:hover {
    border-color: var(--accent);
  }

  .filter-btn.active {
    background-color: var(--accent);
    color: #0b1317;
    border-color: var(--accent);
  }

  #deck {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Cartões Interativos */
  .flashcard {
    background-color: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 26px 24px;
    min-height: 215px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    transition: transform 0.12s ease, border-color 0.2s ease, background-color 0.2s ease;
    user-select: none;
  }

  .flashcard:hover {
    border-color: var(--accent);
  }

  .flashcard.flipped {
    background-color: var(--bg-card-back);
    border-color: var(--alert);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  .cat-label {
    font-size: 12px;
    font-weight: bold;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .side-label {
    font-size: 11px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 12px;
    text-transform: uppercase;
  }

  .side-front {
    background-color: rgba(116, 192, 252, 0.15);
    color: var(--accent);
  }

  .side-back {
    background-color: rgba(255, 212, 59, 0.15);
    color: var(--alert);
  }

  .card-content {
    font-size: 18px;
    text-align: center;
    margin: auto 0;
  }

  .card-content strong {
    color: #ffffff;
  }

  .pegadinha {
    display: block;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    color: var(--alert);
    font-size: 15px;
  }

  .card-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 14px;
  }

  .footer-nav {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 34px;
  }

  .btn-nav {
    background-color: var(--bg-card);
    color: var(--accent);
    text-decoration: none;
    padding: 15px 28px;
    border: 2px solid var(--accent);
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    transition: 0.2s;
  }

  .btn-nav:hover {
    background-color: var(--accent);
    color: #0b1317;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Alternador de Cores Neutras -->
  <div class="theme-bar" id="themeBar">
    <span class="theme-label">Tom neutro:</span>
    <button type="button" class="theme-btn active" data-set-theme="petroleo">Ardósia Azulada</button>
    <button type="button" class="theme-btn" data-set-theme="ardosia">Grafite Neutro</button>
    <button type="button" class="theme-btn" data-set-theme="areia">Café / Areia Escura</button>
  </div>

  <header>
    <h1>Segurados do INSS — Flashcards</h1>
    <p class="subtitle">Filtre um segurado por vez e toque no cartão para virar</p>
  </header>

  <!-- Filtros -->
  <div class="filters" id="filterBar">
    <button type="button" class="filter-btn active" data-filter="todos">Todos (12)</button>
    <button type="button" class="filter-btn" data-filter="empregado">1. Empregado</button>
    <button type="button" class="filter-btn" data-filter="domestico">2. Doméstico</button>
    <button type="button" class="filter-btn" data-filter="individual">3. Cont. Individual</button>
    <button type="button" class="filter-btn" data-filter="avulso">4. Avulso</button>
    <button type="button" class="filter-btn" data-filter="especial">5. Especial</button>
    <button type="button" class="filter-btn" data-filter="facultativo">6. Facultativo</button>
  </div>

  <div id="deck"></div>

  <div class="footer-nav">
    <a href="index.html" class="btn-nav">← Menu Principal</a>
    <a href="aula4.html" class="btn-nav">Flashcards Aula 4 →</a>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const cardsData = [
      {
        id: 0,
        cat: "empregado",
        titulo: "1. Empregado (Obrigatório)",
        f: "Quais são os 4 requisitos do Empregado comum e quando nasce sua filiação?",
        v: "<strong>Subordinação, habitualidade, pessoalidade e salário.</strong><span class='pegadinha'>⚡ Filiação é AUTOMÁTICA no 1º dia de trabalho, mesmo sem carteira assinada.</span>"
      },
      {
        id: 1,
        cat: "empregado",
        titulo: "1. Empregado (Obrigatório)",
        f: "Servidor com cargo em comissão puro (sem concurso), diretor empregado e contratado no Brasil para filial no exterior entram em qual categoria?",
        v: "Todos são segurados obrigatórios na categoria de <strong>EMPREGADO</strong> (no INSS/RGPS).<span class='pegadinha'>⚡ Diretor só é Empregado se puder ser demitido (subordinação).</span>"
      },
      {
        id: 2,
        cat: "domestico",
        titulo: "2. Empregado Doméstico (Obrigatório)",
        f: "Qual a regra dos dias por semana e da finalidade para caracterizar o Empregado Doméstico?",
        v: "Trabalhar <strong>MAIS de 2 dias por semana</strong> (3 ou mais) em residência, <strong>SEM finalidade lucrativa</strong>.<span class='pegadinha'>⚡ Até 2 dias/semana = Diarista (Contribuinte Individual).</span>"
      },
      {
        id: 3,
        cat: "domestico",
        titulo: "2. Empregado Doméstico (Obrigatório)",
        f: "Se uma família contrata uma cozinheira para trabalhar 5 dias por semana fazendo marmitas para vender na rua, ela é Doméstica?",
        v: "<strong>NÃO!</strong> Como há <strong>finalidade lucrativa</strong>, ela deixa de ser doméstica e vira <strong>Empregada comum</strong>."
      },
            {
        id: 3,
        cat: "domestico",
        titulo: "2. Empregado Doméstico (Obrigatório)",
        f: "Se uma família contrata uma cozinheira para trabalhar 5 dias por semana fazendo marmitas para vender na rua, ela é Doméstica?",
        v: "<strong>NÃO!</strong> Como há <strong>finalidade lucrativa</strong>, ela deixa de ser doméstica e vira <strong>Empregada comum</strong>."
      },
      {
        id: 4,
        cat: "individual",
        titulo: "3. Contribuinte Individual (Obrigatório)",
        f: "Quem é o Contribuinte Individual? Cite 4 exemplos clássicos cobrados pelo Cebraspe.",
        v: "Quem trabalha <strong>por conta própria</strong> (sem subordinação): <strong>MEI, motorista de app, padre/pastor e sócio com pró-labore.</strong>"
      },
      {
        id: 5,
        cat: "individual",
        titulo: "3. Contribuinte Individual (Obrigatório)",
        f: "O síndico de condomínio que NÃO recebe salário, mas ganha isenção da taxa de condomínio, é Facultativo?",
        v: "<strong>NÃO!</strong> A isenção da taxa funciona como remuneração indireta. Ele é <strong>Contribuinte Individual obrigatório</strong>."
      },
      {
        id: 6,
        cat: "avulso",
        titulo: "4. Trabalhador Avulso (Obrigatório)",
        f: "O que diferencia o Trabalhador Avulso (ex: estivador) de um autônomo comum?",
        v: "Presta serviços a várias empresas <strong>SEM vínculo de emprego</strong>, mas com <strong>intermediação OBRIGATÓRIA de Sindicato ou OGMO</strong>.<span class='pegadinha'>⚡ Sem Sindicato ou OGMO = vira Contribuinte Individual.</span>"
      },
      {
        id: 7,
        cat: "especial",
        titulo: "5. Segurado Especial (Obrigatório)",
        f: "Quem é o Segurado Especial e quais são seus dois limites numéricos (terra e temporários)?",
        v: "Produtor rural, pescador artesanal ou extrativista em <strong>economia familiar</strong> (sem empregado fixo).<span class='pegadinha'>⚡ Terra: até 4 módulos fiscais (não vale p/ pescador). Temporários: até 120 dias/ano.</span>"
      },
      {
        id: 8,
        cat: "especial",
        titulo: "5. Segurado Especial (Obrigatório)",
        f: "O Segurado Especial precisa pagar carnê todo mês? E se não vender nada no ano?",
        v: "<strong>NÃO paga carnê mensal!</strong> Contribui com <strong>1,3% apenas sobre a venda</strong> da produção. Se produzir só para consumo próprio, não paga nada e mantém direitos de 1 salário mínimo.<span class='pegadinha'>⚡ Mesmo sem pagar nada, ele É segurado obrigatório!</span>"
      },
      {
        id: 9,
        cat: "facultativo",
        titulo: "6. Segurado Facultativo (Não Obrigatório)",
        f: "Qual a idade mínima do Segurado Facultativo e cite 4 exemplos clássicos.",
        v: "<strong>16 anos ou mais</strong>, sem exercer atividade remunerada: <strong>estudante, dona de casa, estagiário (Lei do Estágio) e síndico sem remuneração/isenção.</strong>"
      },
      {
        id: 10,
        cat: "facultativo",
        titulo: "6. Segurado Facultativo (Não Obrigatório)",
        f: "Como ocorre a filiação do Segurado Facultativo? Ele pode pagar meses atrasados antes da inscrição?",
        v: "Filiação só ocorre após <strong>inscrição + pagamento da 1ª parcela em dia</strong>.<span class='pegadinha'>⚡ Nunca pode pagar período anterior à primeira contribuição em dia.</span>"
      },
      {
        id: 11,
        cat: "facultativo",
        titulo: "6. Segurado Facultativo (Não Obrigatório)",
        f: "Um servidor público já aposentado pelo regime próprio (RPPS) pode se filiar como Segurado Facultativo no INSS?",
        v: "<strong>PROIBIDO!</strong> Quem participa ou já é aposentado por regime próprio de previdência não pode ser facultativo no INSS."
      }
    ];

    const deck = document.getElementById("deck");
    const filterBar = document.getElementById("filterBar");
    const themeBar = document.getElementById("themeBar");
    const estadoVirado = {};

    function renderizarCards(filtro) {
      deck.innerHTML = "";
      const lista = filtro === "todos" 
        ? cardsData 
        : cardsData.filter(item => item.cat === filtro);

      lista.forEach(item => {
        const isFlipped = !!estadoVirado[item.id];
        const cardEl = document.createElement("div");
        cardEl.className = isFlipped ? "flashcard flipped" : "flashcard";
        cardEl.setAttribute("data-id", item.id);

        cardEl.innerHTML = `
          <div class="card-top">
            <span class="cat-label">${item.titulo}</span>
            <span class="side-label ${isFlipped ? "side-back" : "side-front"}">
              ${isFlipped ? "Resposta" : "Pergunta"}
            </span>
          </div>
          <div class="card-content">${isFlipped ? item.v : item.f}</div>
          <div class="card-hint">Toque no cartão para ${isFlipped ? "voltar à pergunta" : "revelar a resposta"}</div>
        `;

        deck.appendChild(cardEl);
      });
    }

    deck.addEventListener("click", function(e) {
      const cardEl = e.target.closest(".flashcard");
      if (!cardEl) return;
      const id = cardEl.getAttribute("data-id");
      estadoVirado[id] = !estadoVirado[id];
      const filtroAtivo = filterBar.querySelector(".active").getAttribute("data-filter");
      renderizarCards(filtroAtivo);
    });

    filterBar.addEventListener("click", function(e) {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      filterBar.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderizarCards(btn.getAttribute("data-filter"));
    });

    themeBar.addEventListener("click", function(e) {
      const btn = e.target.closest(".theme-btn");
      if (!btn) return;
      themeBar.querySelectorAll(".theme-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.documentElement.setAttribute("data-theme", btn.getAttribute("data-set-theme"));
    });

    renderizarCards("todos");
  });
</script>

</body>
</html>
